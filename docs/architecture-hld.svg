<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>

    <!-- Icons: 24x24, stroke based -->
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-browser" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="6.5" r=".9" fill="currentColor"/><circle cx="9" cy="6.5" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="7" r=".9" fill="currentColor"/><circle cx="7" cy="17" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M9 13h7M9 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 6.5l8.5 7 8.5-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.500-3.400 8-8 9-4.600-1-8-4.500-8-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.500 12l2.500 2.500 4.500-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.200" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M18.700 5.300l-2.100 2.100M7.400 16.600l-2.100 2.100" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.500" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.500" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.500 6H15a3 3 0 010 6H9a3 3 0 000 6h6.500" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5.500 5.500 0 0110.500 1.500A3.300 3.300 0 0117 18z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 12px; fill: #1e293b; }
    .m { font-size: 11px; fill: #475569; }
    .lbl { font-size: 11px; fill: #334155; font-weight: 600; }
    .zone { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
    .fe { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.3; }
    .be { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.3; }
    .ext { fill: #fff7ed; stroke: #f97316; stroke-width: 1.3; }
    .sec { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.3; }
    .ln { stroke: #334155; stroke-width: 1.8; fill: none; }
    .lnd { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .badge { fill: #0f172a; }
    .bt { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .ic-fe { color: #2563eb; }
    .ic-be { color: #16a34a; }
    .ic-ex { color: #ea580c; }
    .ic-sec { color: #dc2626; }
    .ic-u { color: #0f172a; }
  </style>

  <rect class="bg" width="1280" height="800"/>
  <text class="title" x="50" y="34">Alma Lead Scheduler: High-Level Design</text>
  <text class="sub" x="50" y="52">Public lead intake, attorney review, resume storage and email notification</text>

  <!-- Zones -->
  <rect class="zone" x="210" y="70" width="240" height="580" rx="10"/>
  <rect class="zone" x="520" y="70" width="440" height="580" rx="10"/>

  <!-- ========== USERS ========== -->
  <g>
    <rect class="card" x="40" y="120" width="130" height="90" rx="10"/>
    <use href="#i-user" class="ic-u" x="91" y="130" width="28" height="28"/>
    <text class="h" x="105" y="176" text-anchor="middle">Prospect</text>
    <text class="m" x="105" y="192" text-anchor="middle">public, no login</text>

    <rect class="card" x="40" y="340" width="130" height="90" rx="10"/>
    <use href="#i-user" class="ic-u" x="91" y="350" width="28" height="28"/>
    <text class="h" x="105" y="396" text-anchor="middle">Attorney</text>
    <text class="m" x="105" y="412" text-anchor="middle">Google SSO, allowlisted</text>
  </g>

  <!-- ========== FRONTEND ========== -->
  <use href="#i-browser" class="ic-fe" x="222" y="80" width="26" height="26"/>
  <text class="h" x="254" y="98">Next.js web app</text>
  <text class="m" x="254" y="112">App Router, port 3000</text>

  <g>
    <rect class="fe" x="226" y="128" width="212" height="62" rx="8"/>
    <text class="h" x="238" y="150">/apply</text>
    <text class="m" x="238" y="167">Public lead form + resume upload</text>
    <text class="m" x="238" y="181">Client validation, honeypot field</text>

    <rect class="fe" x="226" y="204" width="212" height="56" rx="8"/>
    <text class="h" x="238" y="226">/leads</text>
    <text class="m" x="238" y="243">Lead list, state filter (?state=)</text>

    <rect class="fe" x="226" y="274" width="212" height="76" rx="8"/>
    <text class="h" x="238" y="296">/leads/[id]</text>
    <text class="m" x="238" y="313">Detail, resume download,</text>
    <text class="m" x="238" y="327">confirm dialog, mark reached out</text>

    <rect class="fe" x="226" y="364" width="212" height="70" rx="8"/>
    <text class="h" x="238" y="386">Google Identity Services</text>
    <text class="m" x="238" y="403">Browser sign-in, ID token kept in</text>
    <text class="m" x="238" y="417">sessionStorage (this tab only)</text>

    <rect class="fe" x="226" y="448" width="212" height="56" rx="8"/>
    <text class="h" x="238" y="470">lib/api.ts</text>
    <text class="m" x="238" y="487">Single API client, adds Bearer header</text>
  </g>

  <!-- ========== BACKEND ========== -->
  <use href="#i-server" class="ic-be" x="532" y="80" width="26" height="26"/>
  <text class="h" x="564" y="98">FastAPI backend</text>
  <text class="m" x="564" y="112">Layered: routers, services, data access, storage. Port 8000</text>

  <!-- routers -->
  <rect class="be" x="550" y="124" width="380" height="128" rx="8"/>
  <use href="#i-route" class="ic-be" x="560" y="130" width="20" height="20"/>
  <text class="h" x="586" y="145">Routers (HTTP layer)</text>
  <text class="m" x="562" y="165">POST /api/leads (public, multipart, size cap)</text>
  <text class="m" x="562" y="180">GET /api/leads, GET|PATCH /api/leads/{id}</text>
  <text class="m" x="562" y="195">GET /api/leads/{id}/resume (attachment, nosniff)</text>
  <rect class="sec" x="558" y="208" width="364" height="38" rx="6"/>
  <use href="#i-shield" class="ic-sec" x="564" y="214" width="20" height="20"/>
  <text class="t" x="590" y="224" font-weight="600">get_current_attorney</text>
  <text class="m" x="590" y="238">Verify Google ID token, then check email allowlist</text>

  <!-- services -->
  <rect class="be" x="550" y="286" width="380" height="96" rx="8"/>
  <use href="#i-cog" class="ic-be" x="560" y="292" width="20" height="20"/>
  <text class="h" x="586" y="307">Services (business rules)</text>
  <text class="m" x="562" y="327">LeadService: honeypot, PENDING to REACHED_OUT (409 on repeat)</text>
  <text class="m" x="562" y="342">Writes lead + PENDING email rows in one transaction</text>
  <text class="m" x="562" y="357">LeadEmailService: send PENDING rows, mark SENT / FAILED</text>
  <text class="m" x="562" y="372">Runs as a FastAPI BackgroundTask after the response</text>

  <!-- three adapters -->
  <rect class="be" x="550" y="418" width="115" height="74" rx="8"/>
  <use href="#i-layers" class="ic-be" x="558" y="424" width="18" height="18"/>
  <text class="h" x="580" y="438">Data access</text>
  <text class="m" x="558" y="458">SQLAlchemy only</text>
  <text class="m" x="558" y="472">leads, email_events</text>

  <rect class="be" x="682" y="418" width="115" height="74" rx="8"/>
  <use href="#i-layers" class="ic-be" x="690" y="424" width="18" height="18"/>
  <text class="h" x="712" y="438">Storage</text>
  <text class="m" x="690" y="458">ResumeStorage</text>
  <text class="m" x="690" y="472">Magic-byte checks</text>

  <rect class="be" x="815" y="418" width="115" height="74" rx="8"/>
  <use href="#i-layers" class="ic-be" x="823" y="424" width="18" height="18"/>
  <text class="h" x="845" y="438">Email</text>
  <text class="m" x="823" y="458">EmailService</text>
  <text class="m" x="823" y="472">Smtp | Console</text>

  <!-- internal arrows -->
  <path class="ln" d="M740 252 V286" marker-end="url(#arr)"/>
  <path class="ln" d="M607 382 V418" marker-end="url(#arr)"/>
  <path class="ln" d="M740 382 V418" marker-end="url(#arr)"/>
  <path class="ln" d="M872 382 V418" marker-end="url(#arr)"/>

  <text class="m" x="740" y="612" text-anchor="middle">Dependencies point strictly downward:</text>
  <text class="m" x="740" y="627" text-anchor="middle">routers, then services, then data access / storage. Config is env-driven (core/config.py).</text>

  <!-- ========== EXTERNAL / DATA ========== -->
  <!-- SMTP -->
  <rect class="ext" x="1040" y="100" width="220" height="90" rx="10"/>
  <use href="#i-mail" class="ic-ex" x="1052" y="110" width="26" height="26"/>
  <text class="h" x="1086" y="128">SMTP server</text>
  <text class="m" x="1052" y="152">Dev: Mailhog (port 1025)</text>
  <text class="m" x="1052" y="166">Demo: Gmail (STARTTLS 587)</text>
  <text class="m" x="1052" y="180">Prod: SES / SendGrid / Postmark</text>

  <!-- File storage -->
  <rect class="ext" x="1040" y="240" width="220" height="90" rx="10"/>
  <use href="#i-file" class="ic-ex" x="1052" y="250" width="26" height="26"/>
  <text class="h" x="1086" y="268">Resume file storage</text>
  <text class="m" x="1052" y="292">Dev: local disk, uuid4 keys</text>
  <text class="m" x="1052" y="306">Prod: S3 (same interface)</text>
  <text class="m" x="1052" y="320">Never served as public static files</text>

  <!-- DB -->
  <rect class="ext" x="1040" y="380" width="220" height="90" rx="10"/>
  <use href="#i-db" class="ic-ex" x="1052" y="390" width="26" height="26"/>
  <text class="h" x="1086" y="408">SQLite (SQLAlchemy)</text>
  <text class="m" x="1052" y="432">Tables: leads, email_events</text>
  <text class="m" x="1052" y="446">Prod: Postgres (DATABASE_URL)</text>

  <!-- Google -->
  <rect class="ext" x="1040" y="520" width="220" height="100" rx="10"/>
  <circle cx="1065" cy="548" r="13" fill="none" stroke="#ea580c" stroke-width="1.8"/>
  <text x="1065" y="553" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">G</text>
  <text class="h" x="1086" y="546">Google Identity</text>
  <text class="m" x="1052" y="572">Issues signed ID tokens (OIDC)</text>
  <text class="m" x="1052" y="586">Certs fetched + cached by backend</text>
  <text class="m" x="1052" y="600">for signature verification</text>

  <!-- ========== ARROWS ========== -->
  <!-- Prospect -> web -->
  <path class="ln" d="M170 160 H226" marker-end="url(#arr)"/>
  <!-- Attorney <-> web -->
  <path class="ln" d="M170 385 H226" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- web -> api -->
  <path class="ln" d="M438 160 H550" marker-end="url(#arr)"/>
  <text class="lbl" x="494" y="150" text-anchor="middle">public POST</text>
  <path class="ln" d="M438 476 H495 V228 H550" marker-end="url(#arr)"/>
  <text class="lbl" x="484" y="360" transform="rotate(-90 484 360)" text-anchor="middle">Bearer + REST</text>

  <!-- backend -> stores -->
  <path class="ln" d="M872 492 V510 H975 V145 H1040" marker-end="url(#arr)"/>
  <path class="ln" d="M740 492 V540 H990 V285 H1040" marker-end="url(#arr)"/>
  <path class="ln" d="M607 492 V570 H1005 V425 H1040" marker-end="url(#arr)"/>

  <!-- backend -> Google (cert fetch), frontend -> Google (sign-in) -->
  <path class="lnd" d="M900 650 V672 H1020 V590 H1040" marker-end="url(#arrG)"/>
  <path class="lnd" d="M332 650 V712 H1150 V620" marker-end="url(#arrG)"/>
  <text class="lbl" x="700" y="704" text-anchor="middle">6. Browser sign-in returns Google-signed ID token</text>

  <!-- notification email back to attorney -->
  <path class="lnd" d="M1150 100 V60 H24 V385 H40" marker-end="url(#arrG)"/>

  <!-- ========== STEP BADGES ========== -->
  <g>
    <circle class="badge" cx="196" cy="146" r="10"/><text class="bt" x="196" y="150">1</text>
    <circle class="badge" cx="912" cy="298" r="10"/><text class="bt" x="912" y="302">2</text>
    <circle class="badge" cx="912" cy="430" r="10"/><text class="bt" x="912" y="434">3</text>
    <rect x="586" y="46" width="290" height="28" fill="#ffffff"/><circle class="badge" cx="600" cy="60" r="10"/><text class="bt" x="600" y="64">4</text>
    <circle class="badge" cx="912" cy="227" r="10"/><text class="bt" x="912" y="231">5</text>
    <circle class="badge" cx="184" cy="371" r="10"/><text class="bt" x="184" y="375">6</text>
  </g>
  <text class="lbl" x="1012" y="690" text-anchor="end">Fetch + cache signing certs</text>
  <text class="lbl" x="616" y="64">Notification email with a link to /leads/{id}</text>

  <!-- ========== LEGEND / FLOW ========== -->
  <rect x="40" y="732" width="1200" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="m" x="54" y="750"><tspan font-weight="700" fill="#0f172a">1</tspan> Prospect submits form  <tspan font-weight="700" fill="#0f172a">2</tspan> Service validates resume, saves file, writes lead + PENDING email rows in one transaction  <tspan font-weight="700" fill="#0f172a">3</tspan> Background task sends email, marks SENT / FAILED</text>
  <text class="m" x="54" y="768"><tspan font-weight="700" fill="#0f172a">4</tspan> Attorney receives link (no attachment)  <tspan font-weight="700" fill="#0f172a">5</tspan> API verifies Google ID token and allowlist on every call  <tspan font-weight="700" fill="#0f172a">6</tspan> Attorney signs in, reviews leads, downloads resume, marks REACHED_OUT</text>
  <text class="m" x="54" y="783">Solid line: request / data flow.  Dashed line: identity or notification flow.  Blue: frontend.  Green: backend.  Orange: external / data stores.  Red: security control.</text>
</svg>
